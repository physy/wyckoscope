[package]
name = "wyckoscope"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
description = "A visual-first desktop viewer for CIF and VESTA crystal structures"
license = "MIT OR Apache-2.0"

[package.metadata.bundle]
name = "Wyckoscope"
identifier = "io.github.physy.wyckoscope"
icon = ["assets/icons/wyckoscope-icon.icns"]
category = "Education"
short_description = "A visual crystal-structure viewer"

[dependencies]
bevy = "0.20.1"
bevy_egui = "0.43.1"
cryspglib = "0.2.0"
rfd = "0.15.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
image = "0.25"
nalgebra = "0.34"
ab_glyph = "0.2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

