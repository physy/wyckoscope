[package]
name = "wyckoscope"
version = "0.1.0"
edition = "2024"
description = "A visual-first desktop viewer for CIF and VESTA crystal structures"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = "0.17.3"
bevy_egui = "0.38.0"
cryspglib = "0.2.0"
rfd = "0.15.4"
thiserror = "2.0"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

